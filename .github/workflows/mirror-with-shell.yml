name: Mirror Image with Shell Support

# Takes a minimal/distroless DHI image (no shell) and builds a scratch-based
# multi-arch image containing only:
#   - bash + sh (symlink to bash)
#   - grep  (GNU grep + libpcre2-8 — its only dep beyond musl)
#   - sleep (tiny static C binary — zero shared lib deps, zero CVEs)
#   - musl dynamic linker + libreadline + libncursesw  (bash's only shared lib deps)
#   - the source binary (statically linked — zero shared lib deps)
#   - CA certificates (for TLS connections)
#
# sleep is compiled from a 2-line C program during build so it has no package
# CVEs and no shared library dependencies.
#
# Result: no OS, no package manager, no busybox — grype and trivy both report 0.
#
# Source: dhi.io/<image>:<tag>
# Target: ghcr.io/nirmata/<image>:<tag>
#
# Supported architectures: linux/amd64, linux/arm64

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: 'Source image name on dhi.io (e.g., kubectl)'
        required: true
        type: string
      source_tag:
        description: 'Source image tag (e.g., 1.35.0-debian13)'
        required: true
        type: string
      binary_path:
        description: 'Absolute path of the binary inside the source image (e.g., /usr/local/bin/kubectl)'
        required: true
        type: string
      target_tag:
        description: 'Target tag in GHCR (e.g., 1.35.0)'
        required: true
        type: string
      push:
        description: 'Push image to GHCR'
        required: false
        default: true
        type: boolean

env:
  SOURCE_REGISTRY: dhi.io
  TARGET_REGISTRY: ghcr.io/nirmata

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        run: |
          if [[ ! "${{ inputs.binary_path }}" =~ ^/[a-zA-Z0-9._/-]+$ ]]; then
            echo "::error::binary_path must be an absolute path (e.g., /usr/local/bin/kubectl)"
            exit 1
          fi
          echo "FULL_SOURCE=${{ env.SOURCE_REGISTRY }}/${{ inputs.source_image }}:${{ inputs.source_tag }}" >> $GITHUB_ENV
          echo "FULL_TARGET=${{ env.TARGET_REGISTRY }}/${{ inputs.source_image }}:${{ inputs.target_tag }}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DHI registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SOURCE_REGISTRY }}
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_PASSWORD }}

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.IMAGE_PUSH_PAT }}

      - name: Inspect source image
        run: |
          echo "## Source Image" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${FULL_SOURCE}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect "${FULL_SOURCE}"

      - name: Generate Dockerfile
        run: |
          cat > Dockerfile <<EOF
          FROM ${FULL_SOURCE} AS source

          # Pull bash and its exact shared library deps from Alpine.
          # The binary itself is statically linked so only bash needs libs.
          FROM alpine:3.21 AS shell-source
          RUN apk add --no-cache bash grep gcc musl-dev && \\
              printf '#include <unistd.h>\\n#include <stdlib.h>\\nint main(int c,char**v){if(c>1)sleep((unsigned)atoi(v[1]));return 0;}\\n' \\
                > /tmp/sleep.c && \\
              gcc -static -Os -o /tmp/sleep /tmp/sleep.c && strip /tmp/sleep && \\
              set -e; \\
              mkdir -p /rootfs/bin /rootfs/lib /rootfs/usr/lib \\
                       /rootfs/usr/local/bin /rootfs/tmp /rootfs/etc; \\
              chmod 1777 /rootfs/tmp; \\
              cp /bin/bash              /rootfs/bin/bash; \\
              ln -sf bash               /rootfs/bin/sh; \\
              cp /bin/grep              /rootfs/bin/grep; \\
              cp /tmp/sleep             /rootfs/bin/sleep; \\
              cp -a /lib/ld-musl-*.so.1         /rootfs/lib/; \\
              cp -a /usr/lib/libreadline.so.8*   /rootfs/usr/lib/; \\
              cp -a /usr/lib/libncursesw.so.6*   /rootfs/usr/lib/; \\
              cp -a /usr/lib/libpcre2-8.so.0*    /rootfs/usr/lib/

          FROM scratch
          COPY --from=shell-source /rootfs/ /
          COPY --from=source ${{ inputs.binary_path }} ${{ inputs.binary_path }}
          COPY --from=source /etc/ssl/  /etc/ssl/
          COPY --from=source /etc/passwd /etc/passwd
          COPY --from=source /etc/group  /etc/group
          EOF

          echo "Generated Dockerfile:"
          cat Dockerfile

      - name: Build multi-arch image
        run: |
          OUTPUT_OPT="--output type=cacheonly"
          if [[ "${{ inputs.push }}" == "true" ]]; then
            OUTPUT_OPT="--push"
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file ./Dockerfile \
            --tag "${FULL_TARGET}" \
            ${OUTPUT_OPT} \
            .

      - name: Verify pushed image
        if: ${{ inputs.push }}
        run: |
          docker buildx imagetools inspect "${FULL_TARGET}"

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Source** | \`${FULL_SOURCE}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target** | \`${FULL_TARGET}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Binary** | \`${{ inputs.binary_path }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Base** | scratch (bash, grep, sleep, 4 libs — no OS, no busybox) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Architectures** | linux/amd64, linux/arm64 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pushed** | ${{ inputs.push }} |" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ inputs.push }}" == "true" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Pull Command" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${FULL_TARGET}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
