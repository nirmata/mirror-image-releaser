name: Mirror Image with Shell Support

# Takes a minimal/distroless DHI image (no shell) and builds a new multi-arch
# image that adds bash and sh by layering the source binary onto
# debian:bookworm-slim — no extra packages installed on top.
#
# Source: dhi.io/<image>:<tag>
# Target: ghcr.io/nirmata/<image>:<tag>
#
# Supported architectures: linux/amd64, linux/arm64

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: 'Source image name on dhi.io (e.g., kubectl)'
        required: true
        type: string
      source_tag:
        description: 'Source image tag (e.g., 1.35.0-debian13)'
        required: true
        type: string
      binary_path:
        description: 'Absolute path of the binary inside the source image (e.g., /usr/bin/kubectl)'
        required: true
        type: string
      target_tag:
        description: 'Target tag in GHCR (e.g., 1.35.0)'
        required: true
        type: string
      push:
        description: 'Push image to GHCR'
        required: false
        default: true
        type: boolean

env:
  SOURCE_REGISTRY: dhi.io
  TARGET_REGISTRY: ghcr.io/nirmata
  # Alpine is used because the DHI kubectl binary is statically linked (no glibc dep).
  # alpine:3.21 + bash = 19 packages, 0 CVEs vs debian:bookworm-slim's 88 packages, 121 CVEs.
  # sh ships with Alpine via busybox; bash is the only added package.
  SHELL_BASE: alpine:3.21

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        run: |
          if [[ ! "${{ inputs.binary_path }}" =~ ^/[a-zA-Z0-9._/-]+$ ]]; then
            echo "::error::binary_path must be an absolute path (e.g., /usr/bin/kubectl)"
            exit 1
          fi
          echo "FULL_SOURCE=${{ env.SOURCE_REGISTRY }}/${{ inputs.source_image }}:${{ inputs.source_tag }}" >> $GITHUB_ENV
          echo "FULL_TARGET=${{ env.TARGET_REGISTRY }}/${{ inputs.source_image }}:${{ inputs.target_tag }}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DHI registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SOURCE_REGISTRY }}
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_PASSWORD }}

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.IMAGE_PUSH_PAT }}

      - name: Inspect source image
        run: |
          echo "## Source Image" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${FULL_SOURCE}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect "${FULL_SOURCE}"

      - name: Generate Dockerfile
        run: |
          # Only adds bash on top of Alpine (sh ships with Alpine via busybox).
          # Works because the DHI kubectl binary is statically linked — no glibc dep.
          cat > Dockerfile <<EOF
          FROM ${FULL_SOURCE} AS source
          FROM ${{ env.SHELL_BASE }}
          RUN apk add --no-cache bash
          COPY --from=source ${{ inputs.binary_path }} ${{ inputs.binary_path }}
          EOF

          echo "Generated Dockerfile:"
          cat Dockerfile

      - name: Build multi-arch image
        run: |
          OUTPUT_OPT="--output type=cacheonly"
          if [[ "${{ inputs.push }}" == "true" ]]; then
            OUTPUT_OPT="--push"
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file ./Dockerfile \
            --tag "${FULL_TARGET}" \
            ${OUTPUT_OPT} \
            .

      - name: Verify pushed image
        if: ${{ inputs.push }}
        run: |
          docker buildx imagetools inspect "${FULL_TARGET}"

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Source** | \`${FULL_SOURCE}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target** | \`${FULL_TARGET}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Binary** | \`${{ inputs.binary_path }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Architectures** | linux/amd64, linux/arm64 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pushed** | ${{ inputs.push }} |" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ inputs.push }}" == "true" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Pull Command" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${FULL_TARGET}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
